name: Build and verify Runify

on:
  push:
    branches:
      - main
      - feature/rpg-siege-outpost-2026-11-14
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package plugin
        run: mvn --batch-mode --no-transfer-progress package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Runify-QualityArmory
          path: target/QualityArmory.jar
          if-no-files-found: error

  client-mod:
    name: Fabric 1.21.11 client preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build client mod against Minecraft 1.21.11
        run: gradle --no-daemon build
        working-directory: client-mod

      - name: Upload client mod
        uses: actions/upload-artifact@v4
        with:
          name: Runify-Fabric-12111-HitPreview
          path: client-mod/build/libs/*.jar
          if-no-files-found: error
