name: Build Paper 1.21.11 plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if mvn --batch-mode --no-transfer-progress -U package; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: QualityArmory-Paper-1.21.11
          path: target/QualityArmory.jar
          if-no-files-found: error
          retention-days: 14
